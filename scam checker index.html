<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scam Checker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2457d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scam Checker">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f27;--muted:#5d6675;--line:#e2e6ec;--accent:#2457d6;--accent-t:#fff;--ok:#1b8a4b;--warn:#c27a00;--bad:#c9302c;--okb:#e6f5ec;--warnb:#fff3d9;--badb:#fde8e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--text:#eceff4;--muted:#9aa4b2;--line:#2c323c;--accent:#6b97ff;--accent-t:#0b1220;--ok:#4cc585;--warn:#f0b24a;--bad:#ff7a73;--okb:#173324;--warnb:#3a2d12;--badb:#3d1c1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--text:#eceff4;--muted:#9aa4b2;--line:#2c323c;--accent:#6b97ff;--accent-t:#0b1220;--ok:#4cc585;--warn:#f0b24a;--bad:#ff7a73;--okb:#173324;--warnb:#3a2d12;--badb:#3d1c1b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:600px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0 0 6px}h2{font-size:1.15rem;margin:0 0 8px}
p{margin:0 0 12px}.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:14px 16px;width:100%;margin-top:8px;min-height:48px}
button.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.6}
.row{display:flex;gap:10px}.row button{margin-top:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.q{font-size:1.2rem;font-weight:600;margin-bottom:6px}
.hint{font-size:.92rem;color:var(--muted);margin-bottom:10px}
.gauge{text-align:center;border-radius:16px;padding:20px;margin-bottom:14px}
.gauge b{display:block;font-size:2.6rem;line-height:1.1}
.gauge span{font-weight:600}
.low{background:var(--okb);color:var(--ok)}.med{background:var(--warnb);color:var(--warn)}.high{background:var(--badb);color:var(--bad)}
ul{padding-left:20px;margin:0 0 4px}li{margin-bottom:8px}
li small{display:block;color:var(--muted)}
.btn.p{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
ol{padding-left:20px;margin:0 0 10px}
.btn{display:block;text-align:center;text-decoration:none;padding:14px 16px;border-radius:12px;border:1px solid var(--line);color:var(--text);min-height:48px;margin-top:8px}
.note{font-size:.85rem;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body>
<main id="app"></main>

var GEN=[
{t:"Did they contact you first, out of the blue?",h:"A call, text, email, DM or pop-up you didn’t ask for.",w:1,f:"Unexpected contact",tip:"Don’t trust unsolicited contact. Look up the organization yourself and reach out through its official website or app."},

{t:"Are they asking for passwords, one-time codes, PINs, or ID numbers?",h:"Bank details, National Insurance number, verification codes.",w:4,c:1,f:"Request for sensitive codes or details",tip:"No real bank, company or support agent will ask for your password or a code sent to your phone."},

{t:"Are you promised a prize, big returns, or “guaranteed” profit?",h:"Lottery wins, investment tips, easy money, inheritances.",w:3,f:"Too-good-to-be-true promise",tip:"If you didn’t enter, you didn’t win. Guaranteed high returns don’t exist."},
{t:"Were you told to keep it secret?",h:"Not to tell family, your bank, or the store clerk.",w:3,f:"Secrecy demanded",tip:"Scammers isolate you so no one can warn you. Tell someone you trust right away."},
{t:"Are you asked to click a link, install an app, or give remote access to your device?",h:"Including “verify your account” links and screen-sharing tools.",w:3,f:"Link, download or remote-access request",tip:"Don’t click or install. Go to the real site by typing its address yourself."},
{t:"Are you being threatened?",h:"Arrest, lawsuit, frozen account, deportation, or harm to someone you know.",w:3,f:"Threats or intimidation",tip:"Government agencies don’t threaten arrest over the phone or by text. Hang up and verify independently."},

{t:"Is it someone you’ve only met online who now needs money?",h:"A romantic interest, “friend,” or family member in an emergency.",w:3,f:"Online relationship asking for money",tip:"Call the real person on a number you already know. Never send money to someone you haven’t met in person."},

];
var SETS={};
function mk(a){return a.map(function(r){return{t:r[0],w:r[1],f:r[2],tip:r[3],k:r[4]}})}
SETS.buy=mk([
["Have you paid and then been blocked or ignored?",10,"Paid, then blocked or ignored","Stop all contact and don’t send more money. Call your bank straight away (dial 159) and report it.",1],
["Is the seller’s profile new or thin, for example only a few months old, with few friends or reviews?",3,"New or thin seller profile","Scam accounts are often new. Check the profile age, listing history and reviews."],
["Are you asked to pay upfront before you can see, collect or try the item?",3,"Payment upfront","Don’t pay before you’ve seen the item. Pay on collection, or use the platform’s protected checkout."],
["Do they want bank transfer, “friends and family”, or payment outside the platform’s checkout?",3,"Unprotected payment method","These payments give little or no buyer protection. Pay by card or the platform’s protected option."],
["Is the price much lower than similar items?",2,"Price too good to be true","Compare with similar listings. Prices far below normal are a classic lure."],
["Do they refuse to let you see the item in person, or on a live video call?",3,"Won’t let you inspect the item","Ask for a live video of the item. Walk away if they refuse."],
["Are they pushing you onto WhatsApp or text, or to hurry because “others are interested”?",2,"Pressure or moving off-platform","Keep chats on the platform so there’s a record, and don’t be rushed."],
["Do the photos look copied from elsewhere, or is the description vague?",2,"Copied or vague listing","Do a reverse image search on the photos to see if they appear elsewhere."]]);
SETS.sell=mk([
["Did they send a link or code to “receive” your payment, or ask for a code from your phone?",10,"Fake payment link or code request","Never click payment links or share codes. Real buyers don’t need either to pay you.",1],
["Did they offer more than the asking price, or send too much and ask for the difference back?",4,"Overpayment","Overpayment scams rely on a payment that later bounces. Refund nothing until cleared funds are in your own account."],
["Do they only show a screenshot or email as “proof” of payment, not money in your own banking app?",4,"Unverified proof of payment","Only trust money you can see in your own bank account."],
["Do they want to send their own courier, or want the item sent before payment is clear?",3,"Courier or shipping before payment","Don’t hand over or send the item until cleared funds are in your account."],
["Do they want to pay by cheque, or from someone else’s account?",3,"Cheque or third-party payment","Cheques can bounce long after you’re credited. Ask for a bank transfer or cash on collection."],
["Is the buyer’s profile new or thin, or do they ask nothing about the item?",2,"New or thin buyer profile","Be cautious of new accounts and buyers who show no interest in the item."],
["Are they pushing you onto WhatsApp or text, or to hurry?",2,"Pressure or moving off-platform","Keep chats on the platform and don’t be rushed."]]);
SETS.bank=mk([
["Are you being asked to move money to a “safe account”?",10,"“Safe account” request","No bank or police officer will ever ask this. Hang up and dial 159.",1],
["Are you being asked for your full PIN, password, or a code sent to your phone?",10,"Request for PIN, password or code","Never share these with anyone, even someone who sounds official.",1],

["Are you asked to install an app or give remote access to your device?",4,"Remote access or app install","Never install software for someone who contacted you."],
["Are you told not to tell the bank, staff, or family?",3,"Secrecy demanded","Scammers isolate you so no one can warn you. Tell someone you trust."],

["Do they claim to be the police, or to have “detected fraud” on your account?",2,"Claims of police or fraud team","Anyone can claim this, and caller ID can be faked."]]);

["Did it come from an unknown mobile number or personal email?",2,"Odd sender","Couriers use official channels. Check the sender carefully."]]);
